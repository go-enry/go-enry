[build-system]
# CFFI 2 supports Python 3.14; setuptools 77 supports SPDX license metadata.
requires = ["setuptools>=77.0.0", "setuptools-scm>=9,<10", "cffi>=2.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enry-python"
dynamic = ["version"]
description = "Python bindings for go-enry language detector"
readme = "README.md"
authors = [
    {name = "go-enry contributors"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cffi>=2.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/go-enry/go-enry"
Repository = "https://github.com/go-enry/go-enry"
Issues = "https://github.com/go-enry/go-enry/issues"
Documentation = "https://github.com/go-enry/go-enry/tree/master/python"

[dependency-groups]
test = ["pytest>=7.0.0", "psutil>=5.9.0"]
ci = ["build>=1.2.2", "twine>=6.1", "packaging>=24"]

[tool.setuptools]
packages = ["enry"]
# Ensure the build script is included in the sdist so others can build it
include-package-data = true

# Native code is generated directly in build_lib, never copied from the checkout.
[tool.setuptools.exclude-package-data]
enry = ["*.so", "*.dylib", "*.dll", "*.h"]

# Python releases have their own namespace, separate from Go's v* tags.
[tool.setuptools_scm]
root = ".."
tag_regex = '^python-v(?P<version>[0-9]+\.[0-9]+\.[0-9]+(?:a[0-9]+|b[0-9]+|rc[0-9]+)?)$'
git_describe_command = "git describe --dirty --tags --long --match python-v[0-9]*"

[tool.cibuildwheel]
# requires-python supplies the lower bound. Prereleases stay disabled.
build = "cp3*-*"
skip = "cp3*t-* *-win* *-musllinux*"
test-groups = ["test"]
# Copy tests away from the checkout so pytest imports the installed wheel.
# Paths are relative to the repository root used to invoke cibuildwheel.
test-sources = ["python/tests"]
test-command = "python -m pytest python/tests -q"
