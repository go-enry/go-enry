name: Release Policy
on:
  pull_request:
    paths: ['.github/release/**', '.github/release-please-config.json', '.github/workflows/python-release.yml', '.github/workflows/release-policy-test.yml']
  push:
    branches: [master]
    paths: ['.github/release/**', '.github/release-please-config.json', '.github/workflows/python-release.yml', '.github/workflows/release-policy-test.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix .github/release
