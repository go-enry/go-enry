name: Validate Linguist Sync
on:
  pull_request:
    paths:
      - '.github/scripts/*linguist*'
      - '.github/workflows/sync-linguist.yml'
      - '.github/workflows/validate-linguist-sync.yml'

permissions:
  contents: read
concurrency:
  group: validate-linguist-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the documented Linguist release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export LINGUIST_TAG=$(python3 -c 'import pathlib, re; print(re.search(r"version \*\*(v[0-9]+\.[0-9]+\.[0-9]+)\*\*", pathlib.Path("README.md").read_text())[1])')
          python3 .github/scripts/sync_linguist.py check
      - name: Validate isolated generation without publishing
        env:
          LINGUIST_TAG: ${{ steps.release.outputs.tag }}
          LINGUIST_COMMIT: ${{ steps.release.outputs.commit }}
        run: bash .github/scripts/generate_linguist.sh
