name: Python Tests
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['**.go', 'go.mod', 'go.sum', 'python/**', '.github/**']
  pull_request:
    paths: ['**.go', 'go.mod', 'go.sum', 'python/**', '.github/**']

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # cibuildwheel covers supported CPython versions. This checks editable installs.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group python/pyproject.toml:test -e ./python
      - name: Test editable install and long memory regression
        env:
          ENRY_MEM_RUN_LONG: '1'
          ENRY_MEM_ITERS_LONG: '50000'
        run: python -m pytest python/tests -q
