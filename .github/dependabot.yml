version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /.github/release
    schedule:
      interval: monthly
    groups:
      release-tooling:
        patterns: ['*']
    open-pull-requests-limit: 1
